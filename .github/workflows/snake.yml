name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # allows manual run
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00f5d4&color_dots=#161b22,#3b1f72,#6f3bd6,#a35cff,#d9a8ff&color_dot_border=#0d1117&color_empty=#161b22&sizeDotBorderRadius=12&sizeDot=10&sizeCell=14
            dist/github-contribution-grid-snake.svg?color_snake=#ff6a00&color_dots=#ebedf0,#ffd6a5,#ffb347,#ff8c1a,#e65c00&color_dot_border=#ffffff&color_empty=#ebedf0&sizeDotBorderRadius=12&sizeDot=10&sizeCell=14

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
